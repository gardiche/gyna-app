# Variante Nginx (si le VPS utilise déjà Nginx plutôt que Caddy).
# Certificat : certbot --nginx -d gyna-bridge.alpact.fr
server {
    listen 443 ssl http2;
    server_name gyna-bridge.alpact.fr;

    ssl_certificate     /etc/letsencrypt/live/gyna-bridge.alpact.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gyna-bridge.alpact.fr/privkey.pem;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Streaming SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20m;
    }
}
