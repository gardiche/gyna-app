# Modèle : install.sh remplace GYNA_BRIDGE_HOST par le nom d'hôte du pont.
# Bloc HTTP seulement : certbot y ajoute le HTTPS et la redirection.
server {
    listen 80;
    listen [::]:80;
    server_name GYNA_BRIDGE_HOST;
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Streaming SSE : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20m;
    }
}
